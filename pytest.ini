[pytest]
testpaths = tests
addopts = -q
# Tests must never write inside artifacts/ -- several files there are tracked.
# tests/conftest.py enforces this: every fixture hands back a tmp_path directory,
# and an autouse guard fails any test that creates or removes a file in the real
# artifacts/ directory. See HANDOVER.md section 8.
filterwarnings =
    ignore::DeprecationWarning:thop.*
