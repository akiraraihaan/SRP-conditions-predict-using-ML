# Evaluation folds for REPORTING.
#
# Built ONCE by scripts/00_build_folds.py into artifacts/folds.json, which is
# committed and treated as a frozen input. Every arm, every ablation and every
# baseline consumes that same file so all comparisons are paired.
# Do not regenerate it.

cv:
  n_splits: 5
  n_repeats: 3

# --- Seeds ---------------------------------------------------------------
# run_seed and val_seed are PURE FUNCTIONS of (repeat, fold) and are IDENTICAL
# across every arm:
#
#     run_seed = seeds.run_base + repeat * 100 + fold
#     val_seed = run_seed + seeds.val_slice_offset
#
# yolo26n at (repeat 1, fold 3) uses the same run_seed as resnet18 at
# (repeat 1, fold 3) and the same as the unweighted ablation arm at
# (repeat 1, fold 3). That is what makes every comparison paired, and for the
# ablation it is what isolates the class-weighting effect. The 10% validation
# slice inside each fold is likewise identical across arms.
#
# A per-repeat seed would make all five folds within a repeat share one
# initialisation -- sampling training stochasticity three times instead of
# fifteen, and confounding partition with seed. Do not reintroduce one.
seeds:
  cv_partition: 42          # RepeatedStratifiedKFold random_state
  run_base: 10000           # run_seed = run_base + repeat*100 + fold
  val_slice_offset: 50000   # val_seed = run_seed + val_slice_offset

# Stratified validation slice carved out of each fold's TRAINING indices, used
# only for best-weight selection during training. Never for reporting.
val_slice:
  fraction: 0.10

# The legacy 80:10:10 development split. Recovered, not re-derived.
# Selection only (scripts 01 and 02); never a reporting split.
# See MIGRATION_NOTES.md section 4.
dev_split:
  train: 0.8
  val: 0.1
  test: 0.1
  random_state: 42
