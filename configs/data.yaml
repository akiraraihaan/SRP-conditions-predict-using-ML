# Data contract. Nothing downstream may hardcode a path; everything resolves here.
#
# The dataset is RAW and labelled only by directory:
#   <data_root>/<class_dir>/*.png|*.jpg
# There is NO pre-existing train/val/test directory structure. All partitioning
# is done in code from the class directories.

# Kaggle private dataset
#   slug  : raihanakirar/srp-dyna-card
#   mount : /kaggle/input/srp-dyna-card
# Note the dataset/ wrapper directory inside the mount.
# Override with the SRPCARD_DATA_ROOT environment variable for local or
# Raspberry Pi runs.
data_root: /kaggle/input/srp-dyna-card/dataset

# Safety net: if data_root contains exactly one subdirectory and that
# subdirectory holds the class directories, descend into it automatically and
# log that it happened. Covers the case where the mount point is given without
# the wrapper, or where Kaggle adds one.
descend_single_wrapper: true

# Where generated outputs go. Relative paths resolve against the repo root.
artifacts_dir: artifacts
runs_dir: runs

# Where pretrained checkpoints are looked for before falling back to an
# ultralytics download. Override with SRPCARD_WEIGHTS_DIR.
weights_dir: weights

image_extensions: [".jpg", ".jpeg", ".png", ".bmp", ".tif", ".tiff", ".webp"]

# Strip this from every class directory name before use.
# The uploaded Kaggle copy has ALREADY been cleaned to 10 directories with no
# numeric prefixes, so this normaliser is expected to be a no-op there. It is
# kept as a defensive guard: the old data in ../FINAL-pipeline had 14
# directories because four classes were duplicated under a prefix
# (10_severe_vibration, 12_full_load_production, 29_natural_flowing,
# 30_pump_leakage), and left unnormalised that silently deflated every metric.
# See MIGRATION_NOTES.md section 3.
class_prefix_pattern: '^\d+_'

# Canonical class order. Used for EVERY array, matrix and report.
classes:
  - collide_pump_and_vibration
  - full_load_production
  - gas_influence
  - gas_influence_and_vibration
  - insufficient_liquid_supply_and_vibration
  - natural_flowing
  - pump_leakage
  - severe_insufficient_liquid_supply
  - severe_vibration
  - vibration

# Asserted on load. A mismatch is a hard failure, not a warning.
expected_counts:
  collide_pump_and_vibration: 35
  full_load_production: 52
  gas_influence: 33
  gas_influence_and_vibration: 70
  insufficient_liquid_supply_and_vibration: 106
  natural_flowing: 93
  pump_leakage: 70
  severe_insufficient_liquid_supply: 52
  severe_vibration: 133
  vibration: 51
expected_total: 695

# --- Clean corpus -------------------------------------------------------
# The keys above describe the RAW 695-image corpus and stay as they are: the
# legacy development split is reconstructed on it, unchanged, because its only
# job is comparability with the 46 completed grid-search runs, which were
# trained on contaminated data and cannot be retro-fixed.
#
# The block below describes the CLEAN corpus that the CV folds -- the reporting
# protocol -- are built on.
#
# Exclusion rule: group the index by sha1. A group whose members span more than
# one normalised class is a CONFLICT group and every file in it is excluded.
# Not "keep one": without expert adjudication we cannot know which label is
# correct, so keeping either member risks planting a wrong label. Dropping the
# whole group is mechanical and needs no judgement. A group that is
# byte-identical WITHIN a single class is benign duplication and is NOT
# excluded. See MIGRATION_NOTES.md section 12.
clean_corpus:
  exclusion_rule: sha1_group_spanning_multiple_classes
  expected_conflict_groups: 13
  expected_excluded: 27
  expected_total: 668
  expected_counts:
    collide_pump_and_vibration: 35
    full_load_production: 50
    gas_influence: 31
    gas_influence_and_vibration: 69
    insufficient_liquid_supply_and_vibration: 106
    natural_flowing: 85
    pump_leakage: 65
    severe_insufficient_liquid_supply: 52
    severe_vibration: 129
    vibration: 46
  # 129 / 31
  imbalance_ratio: 4.16

# --- Legacy reference (READ-ONLY) ---------------------------------------
# The completed prior study. Used only to RECOVER the development split and to
# cross-reference the old results. Nothing in this repository ever writes to it.
# Override with SRPCARD_LEGACY_DIR. Relative paths resolve against the repo root.
#
# It is absent on Kaggle, which is why artifacts/dev_split.json is committed:
# scripts 01 and 02 need the development split and cannot re-recover it there.
legacy_reference:
  dir: ../FINAL-pipeline
  # Materialised legacy split. Letterboxed re-encodings, so their bytes differ
  # from the raw originals -- sha1 matching falls through to filename, scoped by
  # normalised class. See MIGRATION_NOTES.md section 4.
  split_dir: yolo_dataset
  registry: results/training_registry.json
  canonical_metrics: results/metrics_canonical.csv
  selected_run: n_ep50_bs16_lr1e-02
  selected_weights: runs/classify/yolo26_n_cls_ep50_bs16_lr1e-02/weights/best.pt
